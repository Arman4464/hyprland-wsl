[main]
font=JetBrainsMono Nerd Font:size=11
pad=12x12 center

[colors]
alpha=0.88
background=0a0b0f
foreground=e3e4e8

## Regular colors (Rosewood Material palette)
regular0=14161f
regular1=ffb3b0
regular2=f6b084
regular3=f485be
regular4=8595ff
regular5=dadffb
regular6=bfc1cf
regular7=e3e4e8

## Bright colors
bright0=282b3e
bright1=ffdad8
bright2=f7e2d4
bright3=f6d5e6
bright4=19288a
bright5=ffffff
bright6=ffffff
bright7=ffffff

[cursor]
style=beam
color=0a0b0f 8595ff
blink=yes
